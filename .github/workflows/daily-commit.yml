name: Daily Contribution

on:
  schedule:
    # Run once a day at 12:00 PM UTC to generate 3-5 commits
    - cron: '0 12 * * *'
  # Allow manual trigger as well
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make dummy commits
        run: |
          chmod +x run_daily_commits.sh
          ./run_daily_commits.sh

          # Push changes back to the main branch
          git push
