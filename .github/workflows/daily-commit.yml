name: Daily Contribution

on:
  schedule:
    # Run 4 times a day to generate multiple commits
    - cron: '0 */6 * * *'
  # Allow manual trigger as well
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make dummy commits
        run: |
          chmod +x run_daily_commits.sh
          ./run_daily_commits.sh

          # Push changes back to the main branch
          git push
