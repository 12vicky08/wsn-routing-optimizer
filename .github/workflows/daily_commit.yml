name: Daily Contribution

on:
  schedule:
    # Run every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  # Allow manual trigger as well
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make a dummy commit
        run: |
          # Append the current date to a dummy file to ensure a change
          echo "Daily commit: $(date)" >> dummy_daily.txt

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add dummy_daily.txt
          git commit -m "Automated daily maintenance and contribution"

          # Push changes back to the main branch
          git push
