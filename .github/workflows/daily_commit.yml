name: Daily Contribution

on:
  schedule:
    # Run every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  # Allow manual trigger as well
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make a dummy commit
        run: |
          git config --global user.name "R VIKRANTH"
          git config --global user.email "vikranthras@gmail.com"

          # Generate a random number between 3 and 5
          num_commits=$(( (RANDOM % 3) + 3 ))

          for i in $(seq 1 $num_commits); do
            # Append the current date and iteration to a dummy file to ensure a change
            echo "Daily commit iteration $i: $(date)" >> dummy_daily.txt
            git add dummy_daily.txt
            git commit -m "Automated daily maintenance and contribution - commit $i"
          done

          # Push changes back to the main branch
          git push
