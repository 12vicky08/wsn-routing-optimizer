key_numeric_results:
  - "GA-Tabu configured with population size 100, 20 generations, 2000 candidate solutions evaluated, crossover probability 0.8, mutation probability 0.1, Tabu Search neighborhood size 10, tabu list size 7, terminating at 2000 iterations or no further improvement."
  - "Case Study 1 (11 facilities, 11 locations, unconstrained): Best result = 12150, Average = 12166.4, Best time = 2831 ms."
  - "Case Study 2 (fixed gate constraints): Best result = 12150, Average = 12218.9, Best time = 2769 ms."
  - "Case Study 3 (size-restricted placement): Best result = 12404 (all 10 runs), Average = 12404, Best time = 2899 ms."
  - "GA-Tabu result matched lopt-aiNet and outperformed GA, PSO, ACO, ACO-PA, opt-aiNet on the benchmark case studies."
  - "In Case 2, GA-Tabu outcome was superior to prior results (from Vu et al. reference [17]) by 3.1%."
  - "In Case 3, GA-Tabu outcome was superior to prior results (from reference [17]) by 1.6%."
  - "Material handling cost optimization potential of 20-60% depending on facility layout, cited from Lam et al. (reference [2])."
  - "Example combinatorial growth: n=15 facilities yields 1,307,674,368,000 (~10^13) feasible configurations (Table 1)."
stated_limitations: >
  The dataset assumes fixed and symmetric flow and distance values, which may not fully
  capture dynamic or asymmetric real-world conditions; variations in facility size must be
  carefully encoded as constraints to avoid infeasible assignments. Future work directions
  noted by authors: adaptive parameter tuning (dynamic crossover/mutation rates),
  hybridization with reinforcement learning, integration of real-time BIM data for dynamic
  layout adjustments, applying GA-Tabu to larger-scale layouts, incorporating time-dependent
  facility interactions, extending to 3D spatial planning, and exploring parallel or
  cloud-based implementations for scalability.
