title: "A Hybrid Genetic Algorithm and Tabu Search for Construction Site Layout Planning Problem"
authors: "Trieu Xuan Hoa; Tranh Thanh Thuong"
venue_year: "Journal of Telecommunication, Electronic and Computer Engineering (JTEC), 2025"
problem: >
  Construction Site Layout Planning (CSLP) is formulated as a Quadratic Assignment
  Problem (NP-hard): optimally allocating n predefined facilities to m predetermined
  locations to minimize total transportation/interaction cost between facilities, while
  existing metaheuristics (ACO, PSO, etc.) either lack global search capability or
  struggle to escape local optima.
approach: >
  GA-Tabu (GATA): a hybrid algorithm that embeds Tabu Search as a local-search
  refinement step applied to elite individuals within each generation of a Genetic
  Algorithm. GA performs global exploration (roulette wheel selection, Partially
  Mapped Crossover, swap mutation) while Tabu Search intensifies local search around
  top-performing individuals using a tabu list to prevent cycling, aiming to balance
  exploration and exploitation and speed convergence.
