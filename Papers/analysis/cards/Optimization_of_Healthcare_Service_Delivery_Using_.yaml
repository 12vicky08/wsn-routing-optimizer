title: "Optimization of Healthcare Service Delivery Using Deep Genetic Algorithm"
authors: "Girimurugan B; Ashvin T.K; Hemalatha T; Riyaz Hussain Sk; Sannidhan M S; Umaya Salma Shajahan"
venue_year: "Informing Science: The International Journal of an Emerging Transdiscipline, 2025"
problem: "Optimizing the delivery of healthcare services (e.g., patient scheduling, resource allocation, inventory control, treatment planning) is difficult because healthcare institutions are complex and unpredictable, making traditional optimization techniques often insufficient."
approach: "Deep Genetic Algorithm (DGA) framework that combines a deep neural network (DNN) with a genetic algorithm (GA). The DNN evaluates the feasibility/fitness of candidate solutions (encoded from the problem space), and the GA iteratively evolves a population of solutions via selection, crossover, and mutation guided by the DNN fitness scores, for tasks such as patient classification and healthcare resource/service optimization."
