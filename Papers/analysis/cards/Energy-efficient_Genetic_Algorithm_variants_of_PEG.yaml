source_file: Energy-efficient_Genetic_Algorithm_variants_of_PEG.pdf
title: "Energy-efficient genetic algorithm variants of PEGASIS for 3D Wireless Sensor Networks"
authors: Aaqil Somauroo; Vandana Bassoo
venue_year: "Applied Computing and Informatics, 2019 (Vol. 19 No. 3/4, 2023 pagination)"
problem: >
  WSN nodes are energy-constrained and battery replacement is infeasible in remote deployments;
  existing chain-based routing protocols like PEGASIS are largely studied only in 2D despite many
  real applications requiring 3D deployment (e.g., underwater, trees, tunnels, mines), and the
  greedy chain-building algorithm used in PEGASIS produces non-optimal chains, especially in 3D.
approach: >
  PEG-GA and clustered variants (PEG-GA Vertical Clustering, PEG-GA Spherical Clustering): extend
  PEGASIS to 3D and replace its greedy TSP-based chain-building algorithm with a genetic algorithm
  to build a near-minimal-length chain. Clustering (vertical, by x-coordinate; spherical, by radial
  distance from network center) is added to shorten chains and reduce delay, using multi-hop
  inter-cluster transmission. A new weighted energy-and-distance-aware cluster head (CH) selection
  scheme (separate weights for primary vs secondary CH) is proposed to improve load balancing,
  with weights tuned via trial-and-error simulation to maximize First Node Death (FND).
sink_mobility: static
routing_clustering_scheme: >
  Chain-based routing (PEGASIS-derived) with GA-built chains; clustering variants: Vertical
  Clustering (clusters by x-coordinate, cuboid-shaped, threshold (C-1)M/Ctotal < x < CM/Ctotal) and
  Spherical Clustering (clusters by radial distance r from network center, threshold
  (C-1)R/Ctotal < r < CR/Ctotal); multi-hop inter-cluster transmission to primary CH which then
  transmits to BS; CH selection via weighted score of residual energy and distance (Eq. 7-10),
  with different weights for primary and secondary CH.
simulator: MATLAB (version not specified)
node_count: 100
area: "100 m x 100 m x 100 m (3D cubic space)"
energy_model: >
  First-order radio model. ETx-elec/Rx-elec = Eelec*k; ETx-amp = efs*k*d^2 (if d<d0) or emp*k*d^4
  (if d>d0); d0 = sqrt(efs/emp); ERx = Eelec*L; data aggregation cost EDA-tot = s*k*Eda. Parameters:
  Eelec = 50 nJ/bit, efs = 10 pJ/m^2, emp = 0.0013 pJ/bit/m^4, Eda = 5 nJ/bit/signal, E0 (initial
  energy per node) = 0.5 J, packet size k = 2000 bits, C (control token?) = 1 ms, GA population
  size = 100, GA iterations = 10000.
metrics_reported:
  - "Network lifetime: First Node Death (FND) / stability period (rounds)"
  - "Half Node Death (HND) (rounds)"
  - "Last Node Death (LND) (rounds)"
  - "Residual energy vs round number (graph)"
  - "Percentage residual energy of whole network at FND (%) -- load balancing indicator"
  - "Maximum delay (rounds/time, delay = (Tq+Tp+Td)*hops = c*hops)"
  - "Average energy consumed per node per round for first 1000 rounds (Eavg-1000, J)"
