stated_limitations: >
  Weights for CH selection (w1-w4) are determined by trial and error rather than an optimization
  algorithm; the paper suggests future work could use Particle Swarm Optimisation for weight
  selection. Clustering builds chains separately per cluster rather than solving the problem as a
  multiple traveling salesman problem (suggested as future improvement to further minimize chain
  length). Only homogeneous networks with static nodes and static base station were studied;
  heterogeneous networks and mobility of nodes/base station are noted as unexplored future work.
